<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Digital Creator | Links</title>

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />
</head>

<!--
  Темы:
  theme-midnight  — темная фиолетовая
  theme-sunset    — оранжево-розовая
  theme-cyberpunk — черная неоновая

  Чтобы сменить тему, поменяй класс у body.
-->
<body class="theme-midnight">
  <main class="card">
    <div class="avatar">
      <img src="assets/avatar.svg" alt="Аватар" />
    </div>

    <p class="eyebrow">Digital Creator</p>
    <h1>Anton Digital</h1>
    <p class="subtitle">
      Создаю стильные сайты-визитки, лендинги и цифровые решения для личного бренда и бизнеса.
    </p>

    <section class="links" aria-label="Основные ссылки">
      <a href="https://t.me/your_username" class="link-button" target="_blank">Telegram</a>
      <a href="https://your-portfolio.com" class="link-button" target="_blank">Портфолио</a>
      <a href="https://wa.me/00000000000" class="link-button" target="_blank">WhatsApp</a>
      <a href="https://youtube.com/@your_channel" class="link-button" target="_blank">YouTube</a>
      <a href="mailto:hello@example.com" class="link-button">Заказать сайт</a>
    </section>

    <footer class="socials" aria-label="Социальные сети">
      <a href="https://t.me/your_username" target="_blank">TG</a>
      <a href="https://instagram.com/your_username" target="_blank">IG</a>
      <a href="https://youtube.com/@your_channel" target="_blank">YT</a>
      <a href="https://linkedin.com/in/your_profile" target="_blank">IN</a>
    </footer>
  </main>
    <button id="share-btn" class="share-button">
        <span>Поделиться профилем</span>
    </button>

    <div id="toast" class="toast">Ссылка скопирована!</div>
</body>
<script src="script.js"></script>
</html>
